validation:
  enabled: true
  execution_mode: smoke

  output:
    root: reports/outputs/validation
    latest_directory: reports/outputs/validation/latest
    generate_markdown: true
    generate_html: true
    preserve_historical_runs: true

  chronology:
    require_walk_forward: true
    minimum_training_years: 3
    minimum_validation_months: 12
    minimum_test_months: 12
    purge_days: 5
    embargo_days: 5

  point_in_time_evidence:
    minimum_filing_acceptance_security_fraction: 0.80
    minimum_historical_membership_events: 1
    minimum_delisting_events: 1
    minimum_inactive_price_security_fraction: 0.50
    minimum_historical_volume_security_fraction: 0.80

  walk_forward:
    output_directory: reports/outputs/walk_forward
    evidence_mode: reconstructed_pit_proxy
    start_date: 2018-07-31
    forecast_end_date: 2025-07-31
    strategy_end_date: 2026-06-30
    filing_lag_days: 120
    minimum_annual_periods: 2
    minimum_anchor_securities: 30
    # 630 daily rows retain roughly 2.5 years of pre-decision history while
    # leaving 60 frozen monthly training observations before the locked OOS split.
    minimum_training_price_rows: 630
    price_lookback_rows: 756
    outcome_date_tolerance_days: 14
    portfolio_nav_usd: 100000000
    primary_strategy: wolf_cvar
    approval_cap: CONDITIONALLY_APPROVED
    maximum_rebalance_turnover: 0.06
    include_historical_inactive: true
    classical_alpha:
      enabled: true
      signal_weights:
        benchmark_relative_expected_return_12m: 0.30
        momentum_6m: 0.15
        valuation_score: 0.15
        cash_flow_quality_score: 0.12
        balance_sheet_strength_score: 0.08
        dividend_safety_score: 0.08
        expected_volatility_12m: -0.06
        cvar_5_12m: 0.06
      regional_rank_weight: 0.70
      sector_rank_weight: 0.30
      minimum_peer_count: 5
      base_cost_bps: 17.5
      currency_conversion_bps: 2.0
      impact_coefficient_bps: 10.0
      maximum_participation_rate: 0.05
      assumed_position_weight: 0.05
      retention_bonus_points: 3.0
      cost_penalty_points_per_portfolio_bp: 1.5
    risk_forecast:
      candidate_models:
        - ewma_normal
        - ewma_student_t
        - filtered_historical_simulation
        - dcc_igarch_student_t
      ewma_decay: 0.94
      lookback_rows: 252
      calibration_rows: 63
      minimum_training_rows: 120
      student_t_degrees_freedom: 7.0
      dcc_alpha: 0.03
      dcc_beta: 0.95
      correlation_shrinkage: 0.10
      calibration_scale_factors: [1.00]
      locked_scale_factors: [1.00, 1.025, 1.05, 1.075, 1.10]
      locked_exception_multipliers: [1.00, 1.10, 1.20, 1.30, 1.40]
      locked_exception_days: [0, 1, 3, 5, 10]
      locked_holdout_fraction: 0.40
      locked_minimum_training_rows: 504
      locked_minimum_holdout_rows: 252
      locked_selection_folds: 3
      locked_selection_warmup_rows: 252
      exception_response_multiplier: 1.10
      exception_response_days: 1

  horizons: [3M, 6M, 9M, 12M]

  forecast:
    minimum_observations: 30
    directional_accuracy_threshold: 0.52
    minimum_rank_ic: 0.02
    maximum_normalised_rmse: 1.25
    calibration_bins: 10

  distributions:
    p5_target_coverage: 0.05
    p50_target_coverage: 0.50
    p95_target_coverage: 0.95
    coverage_absolute_tolerance: 0.05
    minimum_pit_observations: 50

  binary_probabilities:
    calibration_bins: 10
    maximum_brier_score: 0.25
    maximum_expected_calibration_error: 0.10
    methods: [raw, isotonic, platt, beta]
    chronological_holdout_fraction: 0.20
    selection_validation_fraction: 0.25
    embargo_months: 12
    minimum_training_dates: 6
    minimum_validation_dates: 6
    minimum_holdout_dates: 6

  risk:
    var_confidence_levels: [0.95, 0.99]
    violation_rate_tolerance: 0.02
    kupiec_pvalue_threshold: 0.05
    christoffersen_pvalue_threshold: 0.05
    chronological_holdout_fraction: 0.40
    minimum_holdout_observations: 252
    governance_segment: chronological_holdout
    expected_shortfall_bootstrap_samples: 1000

  portfolio:
    rebalance_frequency: monthly
    base_currency: USD
    cash_rate_column: cash_return
    minimum_backtest_months: 60
    maximum_turnover_annualised: 1.5
    maximum_annualised_cost_drag: 0.015
    minimum_net_sharpe: 0.25
    maximum_drawdown_limit: -0.35
    maximum_single_period_loss: -0.20
    require_significant_benchmark_outperformance: true

  costs:
    base_commission_bps: 5.0
    half_spread_bps: 7.5
    slippage_bps: 5.0
    market_impact_enabled: true
    impact_coefficient: 0.10
    stress_multiplier: [1.0, 1.5, 2.0]

  benchmarks:
    - current_portfolio
    - equal_weight
    - cap_weight
    - score_weighted
    - risk_parity
    - cvar_constrained
    - regime_aware
    - selected_classical
    - drl
    - final_portfolio

  regime:
    minimum_observations_per_regime: 20
    probability_sum_tolerance: 0.001

  drl:
    minimum_seeds: 5
    maximum_seed_sharpe_std: 0.35
    maximum_seed_return_std: 0.10
    maximum_drl_blend: 0.25
    require_classical_outperformance_net_of_costs: true
    require_constraint_compliance: true
    require_tail_risk_non_deterioration: true
    require_drawdown_non_deterioration: true

  constraints:
    weight_sum_tolerance: 1.0e-6
    negative_weight_tolerance: 1.0e-10
    cap_tolerance: 1.0e-6
    fail_on_hard_breach: true

  sensitivity:
    enabled: true
    relative_parameter_changes: [-0.20, -0.10, 0.10, 0.20]

  bootstrap:
    enabled: true
    samples: 1000
    confidence_level: 0.95
    block_size: 6
    random_seed: 42

  governance:
    critical_failures_block_approval: true
    minimum_overall_score: 70
    conditional_approval_score: 60
    require_point_in_time_pass: true
    require_constraint_pass: true
    require_risk_backtest_pass: true
    require_net_of_costs_results: true
