drl:
  enabled: true
  mode: historical_walk_forward

  role:
    allocation_mode: residual_overlay
    allow_full_replacement: false
    maximum_drl_blend_weight: 0.10
    baseline_blend_weight: 0.90

  environment:
    decision_frequency: monthly
    monitoring_frequency: daily
    temporal_lookback_days: 60
    include_cash: true
    long_only: true
    leverage_allowed: false
    shorting_allowed: false
    risk_free_rate_annual: 0.0

  action:
    type: residual_weight_adjustment
    maximum_assets: 100
    max_monthly_delta_weight: 0.01
    max_quarterly_delta_weight: 0.02
    no_trade_band_weight: 0.002
    use_softmax: false
    use_constraint_projection: true

  constraints:
    max_single_name_weight: 0.05
    max_new_position_weight: 0.03
    max_sector_weight: 0.25
    max_country_weight: 0.30
    max_region_weight: 0.40
    max_currency_weight: 0.40
    minimum_cash_weight_normal: 0.00
    minimum_cash_weight_stress: 0.05
    maximum_turnover_monthly: 0.10
    maximum_turnover_annual: 0.35
    minimum_liquidity_score: 40
    minimum_average_daily_value_usd: 5000000
    maximum_cvar_5: -0.25
    maximum_expected_shortfall_5: -0.25
    maximum_drawdown_probability: 0.35

  transaction_costs:
    enabled: true
    commission_bps: 2.0
    half_spread_bps_default: 5.0
    currency_conversion_bps: 2.0
    market_impact_enabled: true
    market_impact_coefficient_bps: 10.0
    maximum_participation_rate: 0.05

  reward:
    differential_sharpe_weight: 0.30
    net_return_weight: 0.20
    dividend_income_weight: 0.10
    regime_suitability_weight: 0.08
    diversification_weight: 0.07
    quality_weight: 0.05
    cvar_penalty_weight: 0.10
    drawdown_penalty_weight: 0.10
    transaction_cost_penalty_weight: 0.07
    turnover_penalty_weight: 0.05
    dividend_cut_penalty_weight: 0.04
    liquidity_penalty_weight: 0.04
    narrative_credit_penalty_weight: 0.03
    stress_loss_penalty_weight: 0.02

  regional_reward:
    active_return_scale: 100.0
    transaction_cost_scale: 25.0
    turnover_scale: 0.05
    drawdown_threshold: 0.10
    drawdown_penalty_scale: 0.75
    tail_loss_threshold: 0.05
    tail_loss_penalty_scale: 2.0
    expected_cvar_limit: -0.25
    expected_tail_penalty_scale: 0.25
    volatility_penalty_scale: 0.10

  risk_throttle:
    enabled: true
    low_threshold: 35
    elevated_threshold: 55
    high_threshold: 70
    severe_threshold: 85
    elevated_action_scale: 0.75
    high_action_scale: 0.50
    severe_action_scale: 0.0

  algorithms:
    primary: ppo
    challengers:
      - contextual_bandit
      - convex_residual
    contextual_bandit:
      ridge_penalties: [0.1, 1.0, 10.0]
    convex_residual:
      risk_aversion_values: [1.0, 3.0, 10.0]
      turnover_penalty: 2.0
      cost_penalty: 0.02
    use_stable_baselines3_if_available: true
    fallback_policy: deterministic_mock
    allow_mock_fallback: false

  ppo:
    hidden_layers: [32, 32]
    activation: tanh
    gamma: 0.90
    gae_lambda: 0.90
    clip_range: 0.25
    learning_rate_start: 0.0003
    learning_rate_end: 0.00001
    n_epochs: 4
    n_steps: 128
    batch_size: 64
    ent_coef: 0.001
    torch_num_threads: 1
    total_timesteps_mock: 5000
    total_timesteps_full: 50000
    total_timesteps: 50000
    use_stable_baselines: true
    minimum_random_seeds: 5

  seeds:
    values: [11, 23, 37, 53, 71]
    report_all_seeds: true
    select_on_validation_only: true

  training:
    walk_forward: true
    parallel_seed_workers: 2
    train_fraction: 0.58
    validation_fraction: 0.19
    train_years: 5
    validation_years: 1
    test_years: 1
    step_years: 1
    embargo_rebalance_periods: 1
    use_random_split: false
    retraining_frequency: annual
    minimum_train_periods: 60
    minimum_validation_periods: 12
    minimum_test_periods: 12
    frozen_test_start: 2025-06-30
    frozen_test_end: 2026-05-31
    holdout_label: legacy_locked_oos_seen_once
    prospective_holdout_start: 2026-08-31
    block_bootstrap:
      enabled: true
      environment_count: 4
      block_length_periods: 24
      episode_periods: 120
      training_only: true

  long_history:
    enabled: true
    panel_path: data/processed/drl/regional_long_history.parquet
    training_start: 1997-01-31
    proxy_history_only: true

  specialist_agents:
    enabled: true
    agents:
      - stable_low_chaos
      - crisis_high_chaos
    probabilistic_gating: true

  tcn_encoder:
    enabled: false
    optional_only: true
    residual_blocks: 3
    channels: 32
    kernel_size: 3
    dilations: [1, 2, 4]
    dropout: 0.10
    use_global_average_pooling: true

  explainability:
    enabled: true
    generate_constraint_trace: true
    generate_feature_group_attribution: true
    generate_asset_time_attribution: true
    cam_enabled_when_tcn_available: true

  acceptance:
    maximum_seed_sharpe_std: 0.50
    maximum_seed_weight_dispersion: 0.20
    maximum_constraint_violations: 0
    reject_if_cvar_limit_breached: true
    reject_if_es_limit_breached: true
    reject_if_stress_limit_breached: true
    minimum_oos_observations: 12
    minimum_oos_sharpe_improvement: 0.0
    oos_tail_risk_tolerance: 0.0
    require_positive_active_return_ci: true
    required_prospective_shadow_cycles: 3
