ml_forecasting:
  enabled: true
  mode: deterministic_baseline

  horizons_months: [3, 6, 9, 12]

  models:
    baseline: ridge
    alternative_models:
      - elastic_net
      - random_forest
      - gradient_boosting
    fallback_mode: deterministic_mock

  validation:
    method: walk_forward
    embargo_days: 21
    min_train_periods: 12
    test_periods: 3

  quantiles:
    enabled: true
    levels: [0.05, 0.50, 0.95]
    fallback_mode: residual_bootstrap

  risk_models:
    dividend_cut_threshold: 0.35
    large_drawdown_threshold: 0.30
    severe_p5_return_threshold: -0.20
    high_uncertainty_threshold: 75

  scoring:
    neutral_score: 50
    ml_score_weight: 0.10

  distributional_forecasting:
    enabled: true
    mode: mock
    default_distribution: student_t
    supported_distributions:
      - normal
      - student_t
      - skewed_student_t_placeholder

    parameter_constraints:
      min_sigma: 0.0001
      min_nu: 2.01
      min_xi: 0.1
      max_xi: 10.0

    quantiles:
      levels: [0.01, 0.05, 0.50, 0.95, 0.99]

    risk_metrics:
      var_levels: [0.01, 0.05]
      es_levels: [0.01, 0.05]

    probabilistic_validation:
      enabled: true
      metrics:
        - lps
        - crps
        - pit
        - quantile_coverage
        - calibration_error

    deep_distributional_models:
      enabled: false
      architectures:
        - cnn_1d
        - lstm
        - transformer_encoder
        - xlstm
      default_architecture: lstm
      sequence_length: 10
      output_distribution: skewed_student_t
      n_epochs: 300
      batch_size: 128
      early_stopping: true

    research_extensions:
      enabled: true
      additional_asset_classes:
        enabled: false
        candidates:
          - equity_index
          - rates
          - fx
          - commodities
          - credit
      sensitivity_analysis:
        enabled: true
        shocks:
          nu: [-0.25, 0.25]
          sigma: [0.25]
          xi: [-0.25]
      quantile_based_forecasting:
        enabled: false
        candidates:
          - quantile_regression
          - conformal_prediction
          - quantile_neural_network
      trading_strategy_research:
        enabled: true
        execution_enabled: false

    scoring:
      neutral_score: 50
      high_tail_risk_threshold: 75
      high_skewness_risk_threshold: 75
      high_uncertainty_threshold: 75

supervised_alpha:
  enabled: true
  role: governed_challenger
  output_directory: reports/outputs/supervised_alpha
  model_directory: data/processed/supervised_alpha
  checkpoint_directory: data/interim/supervised_alpha_checkpoints
  resume_checkpoints: true
  horizons_months: [3, 6, 9, 12]
  primary_horizon_months: 3
  top_fraction: 0.20
  regional_benchmark_weight: 0.70
  sector_benchmark_weight: 0.30
  minimum_peer_count: 5
  random_seed: 42
  n_jobs: 4
  categorical_min_frequency: 10
  ols_minimum_features: 5
  ols_maximum_features: 20
  ols_minimum_abs_t_stat: 1.0
  ols_minimum_sign_consistency: 0.55

  models:
    enabled_families:
      - ols_screened
      - ridge
      - elastic_net
      - huber
      - random_forest
      - extra_trees
      - hist_gradient_boosting
      - xgboost
      - xgb_ranker
    parameter_grids:
      ridge:
        - {alpha: 1.0}
        - {alpha: 10.0}
        - {alpha: 100.0}
      elastic_net:
        - {alpha: 0.001, l1_ratio: 0.50}
        - {alpha: 0.01, l1_ratio: 0.10}
        - {alpha: 0.01, l1_ratio: 0.50}
      random_forest:
        - {n_estimators: 120, max_depth: 6, min_samples_leaf: 80, max_features: 0.70}
        - {n_estimators: 120, max_depth: 10, min_samples_leaf: 80, max_features: 0.70}
      hist_gradient_boosting:
        - {learning_rate: 0.04, max_iter: 160, max_leaf_nodes: 7, l2_regularization: 5.0}
        - {learning_rate: 0.04, max_iter: 160, max_leaf_nodes: 15, l2_regularization: 10.0}
      xgboost:
        - {learning_rate: 0.035, n_estimators: 400, max_depth: 2, min_child_weight: 50.0, reg_lambda: 15.0}
        - {learning_rate: 0.035, n_estimators: 400, max_depth: 3, min_child_weight: 75.0, reg_lambda: 25.0}

  validation:
    method: expanding_purged_walk_forward
    validation_start: 2024-03-31
    validation_end: 2025-04-30
    frozen_test_start: 2025-06-30
    frozen_test_end: 2026-05-31
    prospective_holdout_start: 2026-08-31
    cv_test_periods: 3
    minimum_train_periods: 24
    minimum_test_securities: 30
    minimum_outcome_cross_section_coverage: 0.90
    bootstrap_samples: 1000
    quantile_calibration_periods: 12
    quantile_minimum_calibration_periods: 6
    quantile_calibration_target_coverage: 0.95
    purge_rule: label_target_date_before_validation_start

  costs:
    base_cost_bps: 17.5
    currency_conversion_bps: 2.0
    impact_coefficient_bps: 10.0
    maximum_participation_rate: 0.05
    assumed_position_weight: 0.03
    portfolio_nav_usd: 186060522.0
    no_trade_band_return: 0.002
    retention_rank_bonus: 0.10
    entry_cost_rank_penalty: 0.03
    annual_bank_fee_rate: 0.0025
    annual_turnover_budget: 1.50

  acceptance:
    minimum_oos_periods: 12
    minimum_oos_rank_ic: 0.02
    maximum_oos_sign_test_p_value: 0.05
    maximum_annual_turnover: 1.50
    require_positive_active_return_ci: true
    maximum_deployment_blend: 0.25
