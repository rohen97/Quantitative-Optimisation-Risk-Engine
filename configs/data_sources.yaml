data_sources:
  policy:
    use_all_available: true
    require_at_least_one_price_source: true
    cross_validate_prices: true
    maximum_close_difference_fraction: 0.02
    request_timeout_seconds: 30
    retry_attempts: 3
    retry_backoff_seconds: 1.0
    user_agent: wolf-quant-model/1.0
    never_commit_keys: true

  price_provider_order:
    - bloomberg
    - eodhd
    - finnhub
    - alpha_vantage
    - yfinance
    - tickdb
    - alpaca
    - itick

  providers:
    bloomberg:
      enabled: true
      symbol_column: bloomberg_ticker
      availability_env: BLOOMBERG_DESKTOP_ENABLED
      asset_classes: [equities, indices]
      regions: [Mainland China, Hong Kong]
      host: 127.0.0.1
      port: 8194
      notes: Entitled Bloomberg Desktop API on the same logged-in Windows workstation; licensed observations stay local and are never committed.

    yfinance:
      enabled: true
      symbol_column: yfinance_ticker
      credential_env: null
      asset_classes: [equities, indices, fx]
      regions: [DACH, EU ex-DACH, UK, US, Mainland China, Hong Kong]
      notes: Research-grade public web data; cross-validate material prices.

    alpaca:
      enabled: true
      symbol_column: alpaca_ticker
      historical_base_url: https://data.alpaca.markets/{version}
      historical_api_version: v2
      prefer_official_sdk: true
      credential_env: ALPACA_API_KEY_ID
      secret_env: ALPACA_API_SECRET_KEY
      asset_classes: [equities]
      regions: [US]

    eodhd:
      enabled: true
      symbol_column: eodhd_ticker
      base_url: https://eodhd.com/api
      credential_env: EODHD_API_TOKEN
      asset_classes: [equities, fundamentals, dividends, fx, indices, macro, news]
      regions: [DACH, EU ex-DACH, UK, US, Mainland China, Hong Kong]

    finnhub:
      enabled: true
      symbol_column: finnhub_ticker
      base_url: https://finnhub.io/api/v1
      credential_env: FINNHUB_API_KEY
      asset_classes: [equities, fundamentals, dividends, fx, macro, news, sentiment]
      regions: [DACH, EU ex-DACH, UK, US, Mainland China, Hong Kong]

    beam_sec_metadata:
      enabled: true
      base_url: https://api.beamapi.com/data/fundamentals/us/sec/metadata/v1/
      credential_env: BEAM_API_KEY
      asset_classes: [filing_metadata]
      regions: [US]
      preserve_acceptance_timestamps: true
      notes: Observed SEC acceptance timestamps override conservative filing-lag proxies only when security and report date match.

    sec_edgar_submissions:
      enabled: true
      base_url: https://data.sec.gov/submissions
      credential_env: SEC_USER_AGENT
      asset_classes: [filing_metadata]
      regions: [US]
      requests_per_second: 8
      notes: Free first-party fallback for observed SEC acceptance timestamps; the user agent must identify the application and a contact.

    nasdaq_mergent:
      enabled: true
      base_url: https://data.nasdaq.com/api/v3/datatables/MER/F1.json
      credential_env: NASDAQ_DATA_LINK_API_KEY
      asset_classes: [fundamentals]
      regions: [US, DACH, EU ex-DACH, UK]
      reporting_lag_days: 120
      notes: Entitlement-dependent historical fundamentals; report dates receive a conservative lag unless observed filing metadata is available.

    eastmoney:
      enabled: true
      credential_env: null
      asset_classes: [fundamentals]
      regions: [Mainland China, Hong Kong]
      notes: Historical annual statements for reconstructed research evidence; validate terms and licensing before production use.

    alpha_vantage:
      enabled: true
      symbol_column: alpha_vantage_ticker
      base_url: https://www.alphavantage.co
      credential_env: ALPHA_VANTAGE_API_KEY
      asset_classes: [equities, fundamentals, dividends, fx, macro, commodities, news, sentiment]
      regions: [DACH, EU ex-DACH, UK, US, Mainland China, Hong Kong]
      daily_function: TIME_SERIES_DAILY
      output_size: compact
      notes: Compact raw daily prices are free-compatible; adjusted/full history may require a premium plan.


    tickdb:
      enabled: true
      symbol_column: tickdb_ticker
      base_url: https://api.tickdb.ai
      credential_env: TICKDB_API_KEY
      asset_classes: [equities, indices, fx, crypto]
      regions: [US, Mainland China, Hong Kong]
      interval: 1d
      limit: 250
      use_time_range: false
      notes: Unified REST market data API; use for HK stocks and A-shares when yfinance/iTick coverage is thin.

    itick:
      enabled: true
      symbol_column: itick_code
      base_url: https://api.itick.org
      credential_env: ITICK_API_TOKEN
      asset_classes: [equities, fx]
      regions: [US, Mainland China, Hong Kong]
      region_codes:
        US: US
        Mainland China Shanghai: SH
        Mainland China Shenzhen: SZ
        Hong Kong: HK
      notes: Added from the supplied research articles; validate licensing and plan limits.

    frankfurter:
      enabled: true
      base_url: https://api.frankfurter.dev/v2
      credential_env: null
      asset_classes: [fx]
      regions: [DACH, EU ex-DACH, UK, US, Mainland China, Hong Kong]
      currencies: [EUR, CHF, SEK, DKK, GBP, USD, CNY, HKD]
      window_days: 730

    fred:
      enabled: true
      base_url: https://api.stlouisfed.org/fred
      credential_env: FRED_API_KEY
      asset_classes: [macro, rates, credit, volatility]
      regions: [US, DACH, EU ex-DACH, UK, Mainland China, Hong Kong]
      preserve_vintages: true
      non_revising_series:
        - DFF
        - DGS2
        - DGS10
        - DGS30
        - T10Y2Y
        - T10YIE
        - DTWEXBGS
        - BAMLH0A0HYM2
        - BAA10YM
        - DEXUSEU
        - DEXUSUK
        - DEXCHUS
        - DEXHKUS
        - DEXSZUS
        - VIXCLS
      series:
        GDP: GDP
        real_gdp: GDPC1
        CPI: CPIAUCSL
        core_cpi: CPILFESL
        unemployment: UNRATE
        policy_rate: FEDFUNDS
        effective_policy_rate_daily: DFF
        treasury_2y: DGS2
        treasury_10y: DGS10
        treasury_30y: DGS30
        treasury_10y_2y_spread: T10Y2Y
        treasury_10y_breakeven_inflation: T10YIE
        trade_weighted_usd: DTWEXBGS
        credit_spread: BAMLH0A0HYM2
        credit_spread_long_history: BAA10YM
        usd_per_euro: DEXUSEU
        usd_per_gbp: DEXUSUK
        cny_per_usd: DEXCHUS
        hkd_per_usd: DEXHKUS
        chf_per_usd: DEXSZUS
        volatility: VIXCLS

    ecb:
      enabled: true
      base_url: https://data-api.ecb.europa.eu/service
      base_url_env: ECB_DATA_BASE_URL
      credential_env: null
      asset_classes: [macro, rates, fx, credit]
      regions: [DACH, EU ex-DACH]
      preserve_vintages: true
      series:
        eurusd_daily:
          flow: EXR
          key: D.USD.EUR.SP00.A
        eurgbp_daily:
          flow: EXR
          key: D.GBP.EUR.SP00.A
        eurchf_daily:
          flow: EXR
          key: D.CHF.EUR.SP00.A

    ons:
      enabled: true
      base_url: https://api.beta.ons.gov.uk/v1
      base_url_env: ONS_API_BASE_URL
      credential_env: null
      asset_classes: [macro, labour, inflation, demographics]
      regions: [UK]
      notes: Official beta API; dataset/version queries are configured per ingestion request.

    bank_of_england:
      enabled: true
      base_url: https://www.bankofengland.co.uk/boeapps/database/_iadb-fromshowcolumns.asp
      base_url_env: BANK_OF_ENGLAND_BASE_URL
      credential_env: null
      asset_classes: [rates, fx, credit, money]
      regions: [UK]

    china_data:
      enabled: true
      base_url: https://chinadata.live/api/v2
      credential_env: null
      asset_classes: [macro, trade, inflation, demographics]
      regions: [Mainland China]
      datasets:
        - china-gdp
        - china-cpi

    hkma:
      enabled: true
      base_url: https://api.hkma.gov.hk/public
      base_url_env: HKMA_API_BASE_URL
      credential_env: null
      asset_classes: [macro, rates, fx, banking]
      regions: [Hong Kong]
      notes: Endpoint paths are supplied per ingestion request using the official HKMA Open API catalogue.

  research_references:
    - url: https://medium.com/@wutainfofu/2026-free-data-api-for-personal-quant-trading-selection-to-implementation-4c1636e1ff27
      used_for: iTick integration, caching, retry and cross-validation guidance
      authoritative: false
    - url: https://medium.com/@wutainfofu/a-comprehensive-guide-to-e-financial-data-analysis-api-interfaces-f1a50fc99f28
      used_for: cross-market provider review and China/Hong Kong source discovery
      authoritative: false
