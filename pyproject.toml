[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'the-wolf-quant-model'
version = '1.7.0rc1'
description = 'Full-universe conservative equity research and portfolio governance engine.'
requires-python = '>=3.11'
dependencies = [
    'numpy>=1.26,<3',
    'pandas>=2.2,<4',
    'scipy>=1.12,<2',
    'scikit-learn>=1.4,<2',
    'matplotlib>=3.8,<4',
    'pyyaml>=6,<7',
    'yfinance>=0.2.50,<2',
    'alpaca-py>=0.43,<1',
    'duckdb>=1.2,<2',
    'pyarrow>=17,<26',
    'jinja2>=3.1,<4',
    'weasyprint>=62,<67',
    'python-pptx>=1.0,<2',
]

[project.optional-dependencies]
bloomberg = ['blpapi>=3.26,<4']
ml = ['xgboost>=2.1,<4']

[tool.setuptools.packages.find]
where = ['.']
include = ['src*']

[tool.pytest.ini_options]
testpaths = ['tests']
pythonpath = ['.']
